name: CI

# Run on every push to main, on every pull request, and on demand
# (the "Run workflow" button in the Actions tab).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code onto the fresh machine
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Install Python (same minor version as local development)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt   # re-install when either file changes

      # 3. Install the project's dependencies (serving + test tools)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Run the tests. If any test fails, this step fails and so does the build.
      - name: Run tests
        run: pytest tests/ -v

  docker:
    # Only build the image once the tests have passed.
    needs: test
    runs-on: ubuntu-latest

    # id-token: write lets this job ask GitHub for a short-lived identity token,
    # which is what Azure checks when we log in without a password.
    permissions:
      id-token: write
      contents: read

    env:
      ACR_NAME: churnmlops15253
      IMAGE: churnmlops15253.azurecr.io/churn-api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Build once. The image is tagged with the exact commit, so we always know
      # what is deployed, and the same image that is tested is the one we ship.
      - name: Build the image
        run: docker build -t churn-api:ci -t $IMAGE:${{ github.sha }} .

      # Start a container from the image, exactly as it would run anywhere else.
      - name: Start a container
        run: docker run -d --name churn-api -p 8000:8000 churn-api:ci

      # Call the running container: health check, predictions, bad input.
      - name: Smoke test the running container
        run: python3 scripts/smoke_test.py http://localhost:8000

      # If anything above failed, show what the container itself reported.
      - name: Show container logs on failure
        if: failure()
        run: docker logs churn-api

      # From here on, only for pushes to main. Pull requests never touch Azure.
      - name: Log in to Azure (no password, OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push the tested image to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name $ACR_NAME
          docker push $IMAGE:${{ github.sha }}