name: CI

# Run on every push to main, on every pull request, and on demand
# (the "Run workflow" button in the Actions tab).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code onto the fresh machine
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Install Python (same minor version as local development)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip   # reuse downloaded packages between runs

      # 3. Install the project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the tests. If any test fails, this step fails and so does the build.
      - name: Run tests
        run: pytest tests/ -v